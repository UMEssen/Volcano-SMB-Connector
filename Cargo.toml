[package]
name = "smb-kafka-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
globset = "0.4.21"
prometheus = "0.14.0"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "zstd", "libz-static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smb2 = "0.43.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
